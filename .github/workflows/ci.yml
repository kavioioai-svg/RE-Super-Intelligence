name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install
        run: python -m pip install -e './orchestrator[dev]'
      - name: Lint
        working-directory: orchestrator
        run: ruff check resi tests ../skills
      - name: Type-check (strict)
        working-directory: orchestrator
        run: mypy --strict resi
      - name: Tests (leaks are errors)
        working-directory: orchestrator
        run: pytest -W error::ResourceWarning --cov=resi --cov-report=term --cov-fail-under=90 -rs
      - name: Skill package tests
        run: python -m pytest skills/re-super-intelligence/tests -q
      - name: Wheel builds with licence metadata
        run: |
          python -m pip wheel --no-deps -w dist ./orchestrator
          python - <<'PY'
          import glob, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/resi-*.whl")[0])
          names = wheel.namelist()
          meta = wheel.read(next(n for n in names if n.endswith("METADATA"))).decode()
          assert "License-Expression: Apache-2.0" in meta, "licence expression missing"
          for f in ("LICENSE", "NOTICE"):
              assert any(n.endswith(f"licenses/{f}") for n in names), f"{f} missing from wheel"
          PY
      - name: Core has no third-party runtime dependencies
        run: |
          python - <<'PY'
          import tomllib
          deps = tomllib.load(open("orchestrator/pyproject.toml", "rb"))["project"]["dependencies"]
          assert deps == [], f"core must stay standard-library only: {deps}"
          PY
