[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resi"
version = "0.2.0"
description = "RE Super Intelligence - evidence-driven reverse engineering research orchestrator"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kavio Pte Ltd" }]
keywords = ["reverse-engineering", "mcp", "agent-skills", "binary-analysis", "firmware",
            "evidence", "security", "ghidra", "rizin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/kavioioai-svg/RE-Super-Intelligence"
Issues = "https://github.com/kavioioai-svg/RE-Super-Intelligence/issues"
Changelog = "https://github.com/kavioioai-svg/RE-Super-Intelligence/blob/main/CHANGELOG.md"

[project.optional-dependencies]
vision = ["numpy>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5", "numpy>=1.24", "ruff==0.16.9", "mypy>=2.3"]

[project.scripts]
resi = "resi.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
include = ["resi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["resi"]
omit = ["resi/__main__.py"]
