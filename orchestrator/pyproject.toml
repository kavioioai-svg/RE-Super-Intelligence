[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resi"
version = "0.2.0"
description = "RE Super Intelligence - evidence-driven reverse engineering research orchestrator"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5", "numpy>=1.24", "ruff==0.16.9", "mypy>=2.3"]

[project.scripts]
resi = "resi.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
include = ["resi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["resi"]
omit = ["resi/__main__.py"]
